name: Release

# Push a tag like v1.1.0 (must equal "version" in manifest.json) to build and publish a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Optional. When set, a signed .crx is built too. See README "Releases".
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "tag=${GITHUB_REF_NAME} manifest=v${MANIFEST_VERSION}"
          if [ "v${MANIFEST_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version v${MANIFEST_VERSION}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Stage extension files
        run: |
          mkdir -p build/md-studio dist
          cp -r manifest.json background.js editor.html editor.css editor.js icons lib core build/md-studio/
          find build -name '.DS_Store' -delete
          find build -type f | sort

      - name: Package zip
        run: |
          (cd build/md-studio && zip -r -X "${GITHUB_WORKSPACE}/dist/md-studio-${GITHUB_REF_NAME}.zip" .)
          unzip -l "dist/md-studio-${GITHUB_REF_NAME}.zip"

      - name: Build signed CRX
        if: env.CRX_PRIVATE_KEY != ''
        run: |
          KEY_FILE="${RUNNER_TEMP}/crx-key.pem"
          (umask 077 && printf '%s\n' "${CRX_PRIVATE_KEY}" > "${KEY_FILE}")
          npx --yes crx3@1.1.3 -p "${KEY_FILE}" -o "dist/md-studio-${GITHUB_REF_NAME}.crx" build/md-studio
          rm -f "${KEY_FILE}"
          head -c 4 "dist/md-studio-${GITHUB_REF_NAME}.crx"; echo

      - name: Note skipped CRX
        if: env.CRX_PRIVATE_KEY == ''
        run: echo "::notice::CRX_PRIVATE_KEY secret not set, publishing the zip only."

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "MD Studio ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
